name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Weekly model retraining

env:
  PYTHON_VERSION: '3.11'
  PYTHONPATH: '${{ github.workspace }}/src'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting
        run: |
          black --check src/ tests/
          isort --check-only src/ tests/
          flake8 src/ tests/
          mypy src/

      - name: Run tests
        run: |
          pytest tests/ -v --cov=credit_risk --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests

  train-model:
    name: Train Model
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: |
          mkdir -p data/raw
          curl -s "https://archive.ics.uci.edu/ml/machine-learning-databases/statlog/german/german.data" \
            -o data/raw/german_credit.data

      - name: Run training pipeline
        run: |
          python -m credit_risk.pipeline --output-dir outputs/${{ github.run_id }}

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            outputs/${{ github.run_id }}/models/
            outputs/${{ github.run_id }}/reports/
          retention-days: 30

      - name: Publish model metrics
        run: |
          echo "MODEL_ROC_AUC=$(cat outputs/${{ github.run_id }}/reports/*/evaluation_metrics.json | jq -r '.metrics.roc_auc')" >> $GITHUB_ENV
          echo "Model ROC-AUC: ${{ env.MODEL_ROC_AUC }}"

      - name: Comment on PR with metrics
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Model Training Results\n\n- **ROC-AUC**: ${{ env.MODEL_ROC_AUC }}\n- **Run**: ${{ github.run_id }}\n- **Commit**: ${{ github.sha }}`
            })

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: credit-risk-api:${{ github.sha }}
          load: true

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-api -p 8000:8000 credit-risk-api:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/health
          docker stop test-api

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, train-model]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example: kubectl apply -f k8s/staging/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, train-model]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example: kubectl apply -f k8s/production/

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint-and-test, train-model, docker-build, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Send notification
        run: |
          STATUS="${{ needs.lint-and-test.result }}"
          for job in train-model docker-build deploy-staging deploy-production; do
            if [ "${{ needs.$job.result }}" == "failure" ]; then
              STATUS="failure"
            fi
          done
          echo "Pipeline status: $STATUS"
          # Add Slack/Email notification here